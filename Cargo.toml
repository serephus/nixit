[package]
name = "nixit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Declare GitHub repository settings in Nix and sync them through the GitHub API"
license = "GLWTPL"
repository = "https://github.com/serephus/nixit"

[dependencies]
anyhow = "1.0.104"
colored = "3.1.1"
palc = "0.0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
